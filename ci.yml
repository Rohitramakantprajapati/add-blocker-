name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build-core:
    name: Build & Test Core (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (no warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all

      - name: Run benchmarks (regression check)
        run: cargo bench --all 2>&1 | tee bench_output.txt

  validate-blocklist:
    name: Validate Blocklist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r blocklists/scripts/requirements.txt

      - name: Build blocklist
        run: python blocklists/scripts/merge.py

      - name: Validate false positive rate
        run: python blocklists/scripts/validate.py

  lint-extension:
    name: Lint Browser Extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: extension/chromium/package-lock.json

      - name: Install (Chromium)
        working-directory: extension/chromium
        run: npm ci

      - name: Lint (Chromium)
        working-directory: extension/chromium
        run: npm run lint

      - name: Install (Firefox)
        working-directory: extension/firefox
        run: npm ci

      - name: Lint (Firefox)
        working-directory: extension/firefox
        run: npm run lint
