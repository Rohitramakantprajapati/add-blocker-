name: Performance Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  benchmark:
    name: Benchmark Regression Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}

      - name: Run benchmarks
        run: cargo bench --all 2>&1 | tee bench_output.txt

      - name: Check DNS latency target (<0.5ms)
        run: |
          # Parse bench output for dns_block_decision benchmark
          # Fail if p99 latency exceeds 500 microseconds
          python3 scripts/ci/check_bench.py bench_output.txt dns_block_decision 500

      - name: Check AI inference latency (<0.1ms x86)
        run: |
          python3 scripts/ci/check_bench.py bench_output.txt ai_inference_x86 100

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.sha }}
          path: bench_output.txt
