[workspace]
resolver = "2"
members = [
    "core/dns_engine",
    "core/packet_filter",
    "core/ai_engine",
    "sync",
    "platform/linux",
    "ui/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["VoidBlock Contributors"]
repository = "https://github.com/voidblock/voidblock"

[workspace.dependencies]
tokio = { version = "=1.40.0", features = ["full"] }
rusqlite = { version = "=0.39.0", features = ["bundled"] }
lz4 = "=1.24.1"
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter"] }
serde = { version = "=1.0.204", features = ["derive"] }
serde_json = "=1.0.127"
thiserror = "=1.0.61"
r2d2 = "=0.8.10"
r2d2_sqlite = "=0.34.0"
socket2 = "=0.5.7"
lru = "=0.12.3"
reqwest = { version = "=0.12.5", default-features = false, features = ["rustls-tls"] }
base64 = "=0.22.1"
aho-corasick = "=1.1.3"
bincode = "=1.3.3"
ed25519-dalek = "=2.1.1"
sha2 = "=0.10.8"
rand_core = "=0.6.4"
tempfile = "=3.10.1"
criterion = "=0.5.1"
libbpf-rs = "=0.25.0"
tauri = { version = "=2.0.0", features = ["tray-icon"] }
tauri-build = "=2.0.0"
